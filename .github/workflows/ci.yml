name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  # In PRs, a new push cancels the current workflow run
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codegen-check:
    name: Check Codegen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install tfplugingen-openapi
        run: |
          go install github.com/hashicorp/terraform-plugin-codegen-openapi/cmd/tfplugingen-openapi@v0.3.0

      - name: Install tfplugingen-framework
        run: |
          go install github.com/hashicorp/terraform-plugin-codegen-framework/cmd/tfplugingen-framework@v0.4.1

      - name: Run codegen script
        run: sh codegen.sh

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || (echo "ERROR: Code generation produced changes. Please run 'sh codegen.sh' and commit the results." && exit 1)

  docgen-check:
    name: Check Docgen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Run docgen script
        run: sh docgen.sh

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || (echo "ERROR: Doc generation produced changes. Please run 'sh docgen.sh' and commit the results." && exit 1)

  terraform-test:
    name: Terraform Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build provider
        run: go build -o terraform-provider-tsuga

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Setup provider for local testing
        run: |
          mkdir -p ~/.terraform.d/plugins/hashicorp.com/edu/tsuga/0.1.0/linux_amd64
          cp terraform-provider-tsuga ~/.terraform.d/plugins/hashicorp.com/edu/tsuga/0.1.0/linux_amd64/

      - name: Remove existing terraform state
        run: rm -f terraform.tfstate terraform.tfstate.backup

      - name: Terraform init
        run: terraform init

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform validate
        run: terraform validate

      - name: Terraform acceptance tests
        env:
          TSUGA_BASE_URL: "https://api.tsuga-staging.com"
          TSUGA_TOKEN: ${{ secrets.TSUGA_TOKEN }}
          TSUGA_USER_ID: ${{ vars.TSUGA_USER_ID }}
          TF_ACC: 1
        run: |
          go test -v ./...

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Find deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.40.0
          # Also cover WASM-only entrypoint (only used in tests)
          out="$(deadcode -test ./internal/provider/...)"
          if [[ -n "$out" ]] && [[ "$out" != "null" ]]; then
            echo "$out" >&2
            exit 1
          fi

      - name: Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13

      - name: Download dependencies
        run: go mod download

      - name: Go format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd. Run 'gofmt -w .':" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Go test
        run: go test -v ./...

      - name: Go vet
        run: go vet ./...

  wasm:
    name: Terraform export bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "v1.16.4"
          terraform_wrapper: false
      - name: Build WASM and generate resource bindings
        run: node wasm/build.mjs
      - name: Check generated bindings
        run: git diff --exit-code -- wasm/generated
      - name: Type-check generated declarations
        run: npx --yes -p typescript@7.0.2 tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck wasm/test/types.test.ts
      - name: Test browser bindings
        run: node --test wasm/test/browser.test.mjs
      - name: Validate exports with Terraform
        run: node --test wasm/test/terraform.test.mjs
