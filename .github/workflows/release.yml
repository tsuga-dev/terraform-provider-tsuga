# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    branches: [main]
    tags:
      - v*

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Tag latest changelog release
        run: |
          version=$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ {match($0, /[0-9]+\.[0-9]+\.[0-9]+/); print substr($0, RSTART, RLENGTH); exit}' CHANGELOG.md)
          test -n "$version"
          git show-ref --tags --verify --quiet "refs/tags/v$version" && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "v$version" -m "Release v$version"
          git push origin "v$version"

  goreleaser:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$(mktemp)"
          # Print the body of the "## [<version>]" section, stopping at the next "## [" heading.
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          # Trim leading blank lines.
          sed -i -e '/./,$!d' "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::No CHANGELOG section found for ${VERSION}. Add a '## [${VERSION}]' section to CHANGELOG.md and re-tag."
            exit 1
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "----- release notes for ${GITHUB_REF_NAME} -----"
          cat "$NOTES_FILE"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean --release-notes=${{ steps.notes.outputs.file }}
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      # GoReleaser's --release-notes body does not persist on this repo's
      # immutable releases, so set it explicitly after publish.
      - name: Set release notes on the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file "${{ steps.notes.outputs.file }}"

      - name: Prepare Slack release notes
        run: |
          DELIM="EOF_$(openssl rand -hex 16)"
          {
            echo "RELEASE_NOTES<<$DELIM"
            head -c 2500 "${{ steps.notes.outputs.file }}"
            echo
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      - name: Send Slack notification
        uses: rtCamp/action-slack-notify@c33737706dea87cd7784c687dadc9adf1be59990 # pin@v2
        continue-on-error: true
        env:
          SLACK_USERNAME: GitHub CI Bot
          SLACK_COLOR: good
          MSG_MINIMAL: actions url
          SLACK_TITLE: "🚀 Terraform Provider Released"
          SLACK_MESSAGE: |
            A new release has been published: ${{ github.ref_name }}

            ${{ env.RELEASE_NOTES }}
          SLACK_FOOTER: "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
